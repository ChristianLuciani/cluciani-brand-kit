name: CI

on:
  # En main, el push directo está bloqueado por el ruleset; igual se corre
  # para cubrir el merge commit. En PRs el check `test` es el requerido.
  push:
    branches: [main]
  pull_request:

# Least privilege: el workflow sólo lee el repo. Nunca `pull_request_target`.
permissions:
  contents: read

# Un run por ref; un push nuevo cancela el anterior sólo en PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones pinneadas a SHA completo (un tag es mutable); el comentario
      # lleva el tag legible. Renovación: Dependabot, nunca a mano.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # Ningún `.env*` versionado: el `.gitignore` es una convención, el check
      # es el gate (repo-config §4).
      - name: No env files tracked
        run: |
          if git ls-files | grep -Eq '(^|/)\.env(\.|$)' ; then
            echo "::error::Hay un archivo .env versionado; los secretos no entran al repo."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # Paridad de assets contra la fuente del logo (issue #3). Verifica el
      # árbol local contra el manifiesto commiteado (tools/logo/assets.sha256):
      # sin red, hermético. LÍMITE DECLARADO: este step NO consulta la fuente,
      # así que verde significa «el árbol es el declarado», no «el logo es el
      # último». La frescura contra la fuente es manual, con
      # `node tools/logo/verify-assets.mjs --from-source --ref main`, al tocar
      # assets o al revisar el pin (ver README y docs/logo.md §10.1).
      - run: node tools/logo/verify-assets.mjs
      # El gate de fidelidad (npm run logo:verify) necesita Chrome; su
      # cableado en CI es el issue #59 del repo cv-cluciani.
