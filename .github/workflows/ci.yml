name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # El gate de fidelidad (npm run logo:verify) necesita Chrome; su
      # cableado en CI es el issue #59 del repo cv-cluciani.
